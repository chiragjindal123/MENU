<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Menu Detection</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 1.8em;
        }
        .upload-area {
            width: 100%;
            padding: 40px 20px;
            border: 3px dashed #667eea;
            border-radius: 15px;
            text-align: center;
            background: #f8f9ff;
            margin-bottom: 20px;
            cursor: pointer;
        }
        .upload-area:active {
            background: #e8ebff;
        }
        .upload-text {
            font-size: 1.2em;
            color: #667eea;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .upload-subtext {
            font-size: 0.9em;
            color: #666;
        }
        .btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 15px;
            font-size: 1.2em;
            cursor: pointer;
            margin-bottom: 10px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .btn:active { transform: scale(0.98); }
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .results {
            background: #f8f9ff;
            padding: 15px;
            border-radius: 15px;
            margin-top: 20px;
            display: none;
        }
        .results.show { display: block; }
        .result-image {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .count {
            font-size: 2.5em;
            font-weight: 700;
            color: #764ba2;
            text-align: center;
            margin: 15px 0;
        }
        .detection-item {
            background: white;
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            font-size: 0.9em;
        }
        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }
        .loading.show { display: block; }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .info-box {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 15px;
            font-size: 0.9em;
            color: #856404;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 Menu Detection</h1>
        
        <div class="info-box">
            ℹ️ Upload a menu image to detect checked items
        </div>

        <input type="file" id="fileInput" accept="image/*" style="display:none">
        
        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <div class="upload-text">📷 Take Photo or Choose Image</div>
            <div class="upload-subtext">Click here to select</div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>🔍 Analyzing image...</p>
        </div>

        <div class="results" id="results">
            <h3 style="color: #667eea; margin-bottom: 10px;">Detection Results</h3>
            
            <img id="resultImage" class="result-image" style="display:none;">
            
            <div style="text-align: center;">
                <strong>Items Found:</strong>
                <div class="count" id="count">0</div>
            </div>
            
            <div id="detectionList"></div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');

        // File upload handler
        fileInput.addEventListener('change', async (e) => {
            if (e.target.files.length > 0) {
                const file = e.target.files[0];
                await sendForDetection(file);
            }
        });

        // Send image for detection
        async function sendForDetection(imageFile) {
            const formData = new FormData();
            formData.append('image', imageFile);

            // Show loading
            document.getElementById('loading').classList.add('show');
            document.getElementById('results').classList.remove('show');

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    displayResults(data);
                } else {
                    alert('❌ Error: ' + (data.error || 'Detection failed'));
                }
            } catch (error) {
                console.error('Error:', error);
                alert('❌ Network error: ' + error.message);
            } finally {
                document.getElementById('loading').classList.remove('show');
            }
        }

        function displayResults(data) {
            // Show annotated image if available
            const resultImg = document.getElementById('resultImage');
            if (data.annotated_image) {
                resultImg.src = data.annotated_image;
                resultImg.style.display = 'block';
            }

            // Show count
            document.getElementById('count').textContent = data.count;
            
            // Show detection details
            const listDiv = document.getElementById('detectionList');
            if (data.count > 0) {
                listDiv.innerHTML = '<h4 style="color: #667eea; margin: 15px 0 10px 0;">Detection Details:</h4>' +
                    data.detections.map((d, i) => `
                    <div class="detection-item">
                        <strong>✓ Item ${i + 1}</strong><br>
                        Position: (${d.x}, ${d.y})<br>
                        Size: ${d.width} × ${d.height}px<br>
                        Confidence: ${(d.confidence * 100).toFixed(1)}%
                    </div>
                `).join('');
            } else {
                listDiv.innerHTML = '<p style="text-align:center; color:#666; padding:20px;">No items detected. Try adjusting the image or lighting.</p>';
            }
            
            document.getElementById('results').classList.add('show');
        }
    </script>
</body>
</html>
